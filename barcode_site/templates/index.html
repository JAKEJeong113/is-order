<head>

  <meta property="og:title" content="바코드 검색 - 무인 아이스크림·무인매장 바코드 조회" />
  <meta property="og:description" content="무인 아이스크림, 과자·음료·문구류 등 무인매장 상품을 바코드 검색으로 추천판매가까지 바로 확인하세요." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root{
      --mint:#2fc5b3; --mint-dark:#08796f; --mint-soft:#d9fbf5;
      --ink:#16211f; --muted:#5c6a5e; --line:#e4e8e0; --bg:#fbfaf7; --card:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:'Pretendard',-apple-system,"Malgun Gothic",sans-serif;
      display:flex; flex-direction:column; align-items:center;
      padding:48px 20px 32px;
      /* 한글은 기본 줄바꿈 규칙상 "바코드"/"즉시"처럼 한 단어 중간에서도
         잘릴 수 있다 - keep-all로 띄어쓰기 단위로만 줄바꿈되게 한다.
         (overflow-wrap:break-word를 같이 두면 크롬이 keep-all을 무시하고
         짧은 단어까지 강제로 쪼개는 걸 실측으로 확인 - 절대 같이 쓰면
         안 됨. 아주 긴 값(바코드 번호 등)이 넘칠 위험이 있는 곳엔 그
         요소에만 개별적으로 overflow-wrap을 준다.) */
      word-break:keep-all;
    }
    .badge{
      font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
      color:var(--muted); margin-bottom:10px; text-align:center;
    }
    h1{font-size:clamp(22px,5vw,28px); font-weight:800; margin:0 0 8px; letter-spacing:-.5px; text-align:center}
    .sub{color:var(--muted); font-size:14px; margin:0 0 28px; text-align:center; max-width:38ch}

    /* 카드/배경 없이 밑줄과 얇은 구분선만으로 정리한 라인형 스타일 -
       색은 검색 버튼·가격처럼 시선이 가야 할 곳에만 포인트로 쓴다. */
    .search-card{width:100%; max-width:480px}
    .search-row{display:flex; gap:8px; flex-wrap:wrap}
    .search-input-wrap{position:relative; flex:1 1 100%; min-width:0}
    /* 좁은 화면에서는 입력창+스캔+검색 3개가 한 줄에 끼면 입력한 글자가
       버튼에 가려 잘려 보인다 - 입력창은 항상 한 줄 전체를 쓰고, 버튼
       둘은 그 아래 줄에서 폭을 나눠 갖게 한다. */
    .scan-btn, #searchBtn{flex:1}
    .search-input-wrap input{
      width:100%; padding:10px 26px 10px 2px; border:none; border-bottom:2px solid var(--mint);
      border-radius:0; background:transparent; font-size:15px; font-family:inherit; color:var(--ink);
    }
    .search-input-wrap input:focus{outline:none; border-bottom-color:var(--mint-dark)}
    .clear-btn{
      display:none; position:absolute; right:0; top:50%; transform:translateY(-50%);
      width:22px; height:22px; border:none; border-radius:999px; background:var(--line);
      color:var(--muted); font-size:13px; line-height:1; cursor:pointer;
      align-items:center; justify-content:center;
    }
    .clear-btn.show{display:flex}
    .search-row button{
      padding:13px 20px; border:none; border-radius:10px; background:var(--mint);
      color:#fff; font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap;
    }
    .search-row button:disabled{opacity:.6; cursor:default}

    .results{width:100%; max-width:480px; margin-top:14px}
    .result-row{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      border-bottom:1px solid var(--line); padding:12px 2px; cursor:pointer; transition:background .15s;
    }
    .result-row:last-child{border-bottom:none}
    .result-row:active{background:var(--mint-soft)}
    .result-row.copied{background:var(--mint-soft)}
    .result-name{font-size:14px; font-weight:700; margin:0}
    .result-barcode{font-size:11.5px; color:var(--muted); margin:2px 0 0; font-variant-numeric:tabular-nums}
    .result-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0}
    .oq-register-btn{
      padding:4px 10px; border:1px solid var(--mint); border-radius:999px; background:transparent;
      color:var(--mint-dark); font-weight:700; font-size:11px; cursor:pointer; white-space:nowrap;
    }
    .oq-register-btn:active{background:var(--mint-soft)}
    .result-price{font-size:15px; font-weight:800; color:var(--mint-dark); white-space:nowrap}
    .empty, .hint{color:var(--muted); font-size:13.5px; text-align:center; padding:18px 4px}

    .cta{
      width:100%; max-width:480px; margin-top:32px; padding:16px 18px;
      background:var(--mint-soft); border-radius:14px; text-align:center; font-size:13.5px;
      color:var(--mint-dark);
    }
    .cta a{color:var(--mint-dark); font-weight:800; text-decoration:underline}

    .new-products-btn{
      width:100%; max-width:480px; margin-top:20px; padding:13px 18px;
      border:1.5px solid var(--mint); border-radius:999px; background:transparent;
      color:var(--mint-dark); font-weight:700; font-size:14px; cursor:pointer;
    }
    .new-products-btn:active{background:var(--mint-soft)}
    .new-products-panel{width:100%; max-width:480px; margin-top:12px; display:none}
    .new-products-panel.open{display:block}
    .np-filter-row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap}
    .np-filter-btn{
      padding:7px 14px; border:1px solid var(--line); border-radius:999px; background:#fff;
      color:var(--muted); font-weight:700; font-size:12.5px; cursor:pointer;
    }
    .np-filter-btn.active{background:var(--mint); border-color:var(--mint); color:#fff}

    .site-footer{
      width:100%; max-width:480px; margin-top:24px; padding-top:16px;
      border-top:1px solid var(--line); text-align:center;
      color:var(--muted); font-size:12.5px;
    }
    .site-footer a{color:var(--mint-dark); font-weight:700; text-decoration:underline}

    /* 스캔은 보조 행동이라 무채색 테두리로, 검색만 위(#searchBtn)에서 포인트
       컬러를 준다 - 라인형 화면에서도 시선이 갈 곳은 구분되게 한다. */
    .scan-btn{
      padding:13px 16px; border:1px solid var(--mint); border-radius:10px; background:#fff;
      color:var(--mint-dark); font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .scan-btn:disabled{opacity:.6; cursor:default}

    /* 카메라 스캔 오버레이 - 안드로이드 WebView로 감쌌을 때도 그대로 재사용되는
       부분이라, 앱 전용 UI를 따로 안 만들고 이 웹 화면 하나로 웹/앱 둘 다
       커버한다. */
    .scan-overlay{
      position:fixed; inset:0; background:#000; z-index:100;
      display:none; flex-direction:column; align-items:center; justify-content:center;
    }
    .scan-overlay.open{display:flex}
    .scan-overlay-header{
      position:absolute; top:0; left:0; right:0; padding:16px 18px;
      display:flex; justify-content:space-between; align-items:center; z-index:2;
    }
    .scan-overlay-header span{color:#fff; font-weight:700; font-size:14px}
    .scan-close{
      background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:999px;
      width:32px; height:32px; font-size:18px; cursor:pointer; line-height:1;
    }
    #reader{width:100%; max-width:480px}
    .scan-hint{
      position:absolute; bottom:36px; left:0; right:0; text-align:center;
      color:#fff; font-size:13px; padding:0 20px;
    }
    .scan-error{color:#ffb4a8; font-size:13px; text-align:center; padding:0 24px}
    .seo-text{
      width:100%; max-width:480px; margin-top:20px; color:var(--muted);
      font-size:12.5px; line-height:1.6; text-align:center;
    }
  </style>

</head>
<body>
  <div class="badge">i's&nbsp;ORDER</div>
  <h1>무인매장 바코드 조회</h1>
  <p class="sub">무인 아이스크림, 과자·음료·문구류 등 바코드 검색만으로 추천판매가를 바로 확인할 수 있어요.</p>

  <div class="search-card">
    <div class="search-row">
      <div class="search-input-wrap">
        <input id="q" type="text" placeholder="바코드 또는 상품명 입력" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" type="button" aria-label="입력 지우기">✕</button>
      </div>
      <button class="scan-btn" id="scanBtn" type="button">📷 스캔</button>
      <button id="searchBtn">검색</button>
    </div>
  </div>

  <div class="results" id="results"></div>

  <div class="cta">
    이 조회 기능은 무인매장을 위한 발주 자동화 서비스
    <b>i's&nbsp;ORDER</b>의 일부입니다.<br>
    <a href="{{ main_site_url }}/login" target="_blank" rel="noopener">i's&nbsp;ORDER 자세히 보기 →</a>
  </div>

  <p class="seo-text">
    무인 아이스크림 등 무인매장을 운영하신다면 상품명이나 바코드 검색만으로
    추천판매가를 바로 확인하세요. 번호 입력이나 카메라 스캔으로 즉시 조회됩니다.
  </p>

  <!-- 신제품 안내 - 도매몰 자동 크롤링이나 관리자 수동 등록으로 최근(4주
       이내) 새로 들어온 상품을 카테고리별로 훑어볼 수 있게 한다. -->
  <button type="button" class="new-products-btn" id="newProductsBtn">🆕 신제품 안내</button>

  <div class="new-products-panel" id="newProductsPanel">
    <div class="np-filter-row" id="npFilterRow">
      <button type="button" class="np-filter-btn active" data-category="">전체</button>
      <button type="button" class="np-filter-btn" data-category="0">아이스크림</button>
      <button type="button" class="np-filter-btn" data-category="2">도매몰</button>
    </div>
    <div class="results" id="newProductsList"></div>
  </div>

  <footer class="site-footer">
    문의사항이 있으신가요? <a href="mailto:lottotto0404@naver.com">lottotto0404@naver.com</a>
  </footer>

  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-overlay-header">
      <span>바코드 스캔</span>
      <button class="scan-close" id="scanCloseBtn" type="button" aria-label="닫기">✕</button>
    </div>
    <div id="reader"></div>
    <p class="scan-hint" id="scanHint">바코드를 화면 안에 맞춰주세요</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const input = document.getElementById("q");
    const btn = document.getElementById("searchBtn");
    const resultsEl = document.getElementById("results");

    function formatPrice(n) {
      return n ? Number(n).toLocaleString() + "원" : "가격 미등록";
    }

    // 상품명을 data-* 속성 안에 그대로 넣을 때 따옴표 등으로 마크업이
    // 깨지지 않게 이스케이프한다(오더퀸 등록 버튼의 data-name에 사용).
    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // 검색 결과와 "신제품 안내" 목록이 같은 형태(바코드/상품명/추천판매가)라
    // 행 하나 그리는 로직과 바코드 복사·오더퀸 등록 버튼을 그대로 재사용한다.
    function renderRows(items) {
      if (items.length === 0) {
        return '<p class="empty">표시할 상품이 없습니다.</p>';
      }
      // 오더퀸 자동등록 버튼은 안드로이드 앱에서 그 기능을 켜뒀을 때만
      // 보인다(window.AndroidOrderQueen은 앱이 심어주는 JS 인터페이스 -
      // 일반 브라우저에는 아예 없음). 본체 사이트 로그인과 무관하게 앱
      // 자체 설정으로 동작한다.
      const oqAvailable = !!(window.AndroidOrderQueen && window.AndroidOrderQueen.isAvailable());

      return items.map((item) => `
        <div class="result-row" data-barcode="${item.barcode}">
          <div>
            <p class="result-name">${item.menu_name}</p>
            <p class="result-barcode">${item.barcode}</p>
          </div>
          <div class="result-side">
            <span class="result-price">${formatPrice(item.recommended_price)}</span>
            ${oqAvailable ? `<button type="button" class="oq-register-btn" data-barcode="${item.barcode}" data-name="${escapeHtml(item.menu_name)}" data-price="${item.recommended_price || 0}">오더퀸 등록</button>` : ""}
          </div>
        </div>
      `).join("");
    }

    async function runSearch() {
      const query = input.value.trim();
      if (!query) return;

      btn.disabled = true;
      resultsEl.innerHTML = '<p class="hint">검색 중...</p>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        resultsEl.innerHTML = renderRows(data.items || []);
      } catch (e) {
        resultsEl.innerHTML = '<p class="empty">조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", runSearch);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });

    // 검색 결과 목록을 탭하면 그 상품의 바코드를 클립보드에 복사한다 -
    // 고도몰 등 도매몰 상품 등록 화면에 바로 붙여넣을 수 있게 하기 위함.
    // 결과 목록은 매번 innerHTML로 새로 그려지므로, 각 행에 리스너를
    // 다시 붙이는 대신 부모(resultsEl)에 한 번만 위임(delegate)한다.
    function legacyCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(textarea);
      if (!ok) throw new Error("execCommand copy failed");
    }

    async function copyBarcode(barcode, rowEl) {
      try {
        // Clipboard API가 있어도 일부 웹뷰/권한 정책에서 조용히 거부될 수
        // 있으므로, 실패하면 execCommand 방식으로 한 번 더 시도한다.
        try {
          if (!navigator.clipboard || !navigator.clipboard.writeText) {
            throw new Error("clipboard API unavailable");
          }
          await navigator.clipboard.writeText(barcode);
        } catch (clipboardErr) {
          legacyCopy(barcode);
        }
        const priceEl = rowEl.querySelector(".result-price");
        const original = priceEl.textContent;
        rowEl.classList.add("copied");
        priceEl.textContent = "복사됨 ✓";
        setTimeout(() => {
          rowEl.classList.remove("copied");
          priceEl.textContent = original;
        }, 1200);
      } catch (e) {
        // 두 방법 다 막힌 특수한 환경 정도만 해당 - 조용히 무시하고
        // 사용자가 화면에 보이는 바코드 숫자를 직접 복사하면 된다.
      }
    }

    // 검색 결과(#results)와 신제품 안내 목록(#newProductsList) 둘 다 같은
    // 방식으로 클릭을 처리한다 - 매번 innerHTML로 새로 그려지므로 각 행에
    // 리스너를 다시 붙이는 대신 두 부모 컨테이너에 한 번씩만 위임(delegate)한다.
    function handleResultClick(e) {
      const oqBtn = e.target.closest(".oq-register-btn");
      if (oqBtn) {
        // 행 전체 클릭(바코드 복사)으로 이어지지 않게 여기서 끝낸다.
        if (window.AndroidOrderQueen && typeof window.AndroidOrderQueen.registerItem === "function") {
          window.AndroidOrderQueen.registerItem(oqBtn.dataset.barcode, oqBtn.dataset.name, oqBtn.dataset.price);
        }
        return;
      }

      const row = e.target.closest(".result-row");
      if (!row || !row.dataset.barcode) return;
      copyBarcode(row.dataset.barcode, row);
    }

    resultsEl.addEventListener("click", handleResultClick);

    // 입력창 지우기(X) 버튼 - 글자가 있을 때만 보이고, 누르면 입력값과
    // 검색 결과를 함께 비운다.
    const clearBtn = document.getElementById("clearBtn");
    function updateClearBtn() {
      clearBtn.classList.toggle("show", input.value.length > 0);
    }
    input.addEventListener("input", updateClearBtn);
    clearBtn.addEventListener("click", () => {
      input.value = "";
      updateClearBtn();
      resultsEl.innerHTML = "";
      input.focus();
    });
    updateClearBtn();

    // 카메라로 바코드 스캔 - html5-qrcode가 EAN-13/UPC-A 등 실제 상품
    // 바코드 포맷과 QR코드를 모두 인식한다. 이 웹페이지 자체에 넣어둬서
    // 모바일 브라우저에서도, 나중에 이 페이지를 그대로 감싸는 안드로이드
    // WebView 앱에서도 같은 코드로 스캔이 된다(따로 앱 전용 스캔 기능을
    // 만들 필요가 없음).
    const scanBtn = document.getElementById("scanBtn");
    const scanOverlay = document.getElementById("scanOverlay");
    const scanCloseBtn = document.getElementById("scanCloseBtn");
    const scanHint = document.getElementById("scanHint");
    let html5QrCode = null;
    let scanning = false;
    let lastDecoded = null;
    let matchStreak = 0;

    // EAN-13/UPC-A/ITF-14 등 GS1 계열 바코드는 마지막 자리가 체크섬이다
    // (뒤에서부터 3,1 가중치를 번갈아 곱해 합산 후 10의 보수). 카메라
    // 블러로 숫자 하나만 잘못 읽어도 체크섬이 깨지므로, 이걸로 확실한
    // 오인식을 걸러낼 수 있다. 숫자가 아니거나(QR 등) 표준 길이가 아니면
    // 검증 대상이 아니므로 그냥 통과시킨다.
    function isPlausibleBarcode(code) {
      if (!/^\d+$/.test(code)) return true;
      if (![8, 12, 13, 14].includes(code.length)) return true;
      const digits = code.split("").map(Number);
      const checkDigit = digits.pop();
      let sum = 0;
      digits.reverse().forEach((d, i) => {
        sum += d * (i % 2 === 0 ? 3 : 1);
      });
      return (10 - (sum % 10)) % 10 === checkDigit;
    }

    async function stopScan() {
      if (html5QrCode && scanning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {
          // 이미 멈춘 상태 등은 무시 - 오버레이만 닫으면 됨
        }
      }
      scanning = false;
      scanOverlay.classList.remove("open");
    }

    // 안드로이드 앱(WebView)에서는 MainActivity가 이 이름으로 JS 인터페이스를
    // 심어준다 - 있으면 브라우저 표준 카메라 API(html5-qrcode) 대신 앱의
    // 네이티브 카메라(CameraX+ML Kit)를 쓴다. 일부 기기는 브라우저가 노출하는
    // 초점 제어 자체가 고장나 있어(실측: capabilities.focusMode가
    // "continuous"를 지원 목록에 없다고 하면서 현재값은 "continuous"라고
    // 말하는 등 모순 - 웹 표준 API로는 손쓸 수 없는 기기/브라우저 버그) 이
    // 경로로 우회해야 초점이 제대로 맞는다. 일반 브라우저로 접속했을 때는
    // window.AndroidScanner가 없으니 원래 방식(아래) 그대로 동작한다.
    window.receiveNativeScanResult = function (decodedText) {
      input.value = decodedText;
      updateClearBtn();
      runSearch();
    };

    async function startScan() {
      if (window.AndroidScanner && typeof window.AndroidScanner.openNativeScanner === "function") {
        window.AndroidScanner.openNativeScanner();
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        scanHint.textContent = "스캔 기능을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
        scanHint.className = "scan-error";
        scanOverlay.classList.add("open");
        return;
      }

      scanOverlay.classList.add("open");
      scanHint.textContent = "바코드를 화면 안에 맞춰주세요 (흐리면 화면을 탭하세요)";
      scanHint.className = "scan-hint";
      lastDecoded = null;
      matchStreak = 0;

      html5QrCode = new Html5Qrcode("reader", {
        // EAN-13/UPC-A 등 실제 상품 바코드 포맷을 우선순위로 - 포맷을
        // 좁혀주면 프레임마다 시도하는 디코더 수가 줄어서 인식이 더
        // 빠르고 정확해진다.
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.QR_CODE,
        ],
        // 기기가 지원하면 브라우저 내장 바코드 인식기를 쓴다 - 안드로이드
        // WebView처럼 카메라 스트림 화질이 떨어지는 환경에서 JS 디코더보다
        // 훨씬 안정적으로 인식한다.
        useBarCodeDetectorIfSupported: true,
        verbose: false,
      });
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 280, height: 140 },
            // 안드로이드 WebView는 getUserMedia로 카메라를 잡을 때
            // 기본적으로 자동 초점이 꺼진 채로 저해상도 스트림을 주는
            // 경우가 많다 - 화면은 뜨는데 계속 흐릿해서 바코드 인식이
            // 안 되는 원인이 대부분 이것. 초점/해상도를 명시해서 고친다.
            videoConstraints: {
              facingMode: "environment",
              width: { ideal: 1920 },
              height: { ideal: 1080 },
              advanced: [{ focusMode: "continuous" }],
            },
          },
          (decodedText) => {
            // 체크섬이 안 맞는 코드는 블러로 인한 확실한 오인식이므로
            // 무시하고 계속 스캔한다.
            if (!isPlausibleBarcode(decodedText)) {
              return;
            }
            // 같은 코드가 연속으로 2번 이상 읽혀야 확정한다 - 한 프레임만
            // 우연히 (체크섬은 맞지만) 다르게 읽히는 순간적 오인식을
            // 걸러내기 위함이다.
            if (decodedText === lastDecoded) {
              matchStreak += 1;
            } else {
              lastDecoded = decodedText;
              matchStreak = 1;
            }
            if (matchStreak < 2) {
              return;
            }
            input.value = decodedText;
            updateClearBtn();
            stopScan();
            runSearch();
          },
          () => {
            // 프레임마다 못 읽었을 때 호출되는 콜백 - 정상 동작이라 무시한다.
          },
        );
        scanning = true;
        // 시작 시 넣은 focusMode:continuous만으로는 기기에 따라 첫 초점이
        // 안 맞은 채로 멈춰있는 경우가 있다(실사용 확인) - 카메라가 완전히
        // 켜진 뒤(짧은 지연 후) 한 번 더 강제로 재요청해서 "깨워준다".
        // (참고: 일부 기기는 브라우저가 노출하는 초점 제어 능력치 자체가
        // 고장나 있어(capabilities.focusMode에 "continuous"가 없다고 하면서
        // settings는 "continuous"라고 말하는 등 모순) 이 재시도로도 안 될 수
        // 있음 - 그런 기기는 앱에서 네이티브 스캐너(AndroidScanner)를 대신
        // 쓰도록 아래에서 우회한다.)
        setTimeout(refocus, 700);
      } catch (e) {
        scanHint.textContent = "카메라를 사용할 수 없습니다. 브라우저의 카메라 권한을 확인해주세요.";
        scanHint.className = "scan-error";
      }
    }

    // 자동 초점이 흐릿한 채로 멈춰있을 때, 화면을 탭하면 강제로 다시 초점을
    // 맞추게 한다 - 실제 바코드 스캐너 앱들이 흔히 쓰는 방식. html5-qrcode가
    // 지원 여부와 무관하게 시도하고, 지원 안 하는 기기/브라우저면 조용히
    // 무시한다(에러로 사용자에게 보여줄 필요 없는 상황).
    async function refocus() {
      if (!html5QrCode || !scanning) return;
      try {
        if (typeof html5QrCode.applyVideoConstraints !== "function") return;
        const caps = typeof html5QrCode.getRunningTrackCapabilities === "function"
          ? html5QrCode.getRunningTrackCapabilities()
          : null;
        const focusModes = caps && caps.focusMode;
        // 연속 초점(continuous)을 그대로 다시 적용하면 아무 변화가 없다고
        // 보고 무시하는 기기가 있어서, 지원하면 single-shot으로 한 번
        // "리셋"한 뒤 다시 continuous로 돌려 재탐색을 유도한다.
        if (Array.isArray(focusModes) && focusModes.includes("single-shot")) {
          await html5QrCode.applyVideoConstraints({ advanced: [{ focusMode: "single-shot" }] });
        }
        await html5QrCode.applyVideoConstraints({ advanced: [{ focusMode: "continuous" }] });
      } catch (e) {
        // 초점 제어를 지원하지 않는 기기 - 무시
      }
    }

    scanBtn.addEventListener("click", startScan);
    scanCloseBtn.addEventListener("click", stopScan);
    document.getElementById("reader").addEventListener("click", () => {
      scanHint.textContent = "초점을 다시 맞추는 중...";
      scanHint.className = "scan-hint";
      refocus().then(() => {
        if (scanning) {
          scanHint.textContent = "바코드를 화면 안에 맞춰주세요 (흐리면 화면을 탭하세요)";
        }
      });
    });

    // 신제품 안내 - 도매몰 자동 크롤링/관리자 수동 등록으로 최근(4주 이내)
    // 새로 들어온 상품을 카테고리 필터로 훑어본다.
    const newProductsBtn = document.getElementById("newProductsBtn");
    const newProductsPanel = document.getElementById("newProductsPanel");
    const newProductsList = document.getElementById("newProductsList");
    const npFilterRow = document.getElementById("npFilterRow");
    let npLoaded = false;
    let npCurrentCategory = "";

    newProductsList.addEventListener("click", handleResultClick);

    async function loadNewProducts(category) {
      npCurrentCategory = category;
      newProductsList.innerHTML = '<p class="hint">불러오는 중...</p>';
      try {
        const url = category
          ? `/api/new-products?category=${encodeURIComponent(category)}`
          : "/api/new-products";
        const res = await fetch(url);
        const data = await res.json();
        newProductsList.innerHTML = renderRows(data.items || []);
      } catch (e) {
        newProductsList.innerHTML = '<p class="empty">불러오는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>';
      }
    }

    newProductsBtn.addEventListener("click", () => {
      const willOpen = !newProductsPanel.classList.contains("open");
      newProductsPanel.classList.toggle("open", willOpen);
      if (willOpen && !npLoaded) {
        npLoaded = true;
        loadNewProducts(npCurrentCategory);
      }
    });

    npFilterRow.addEventListener("click", (e) => {
      const filterBtn = e.target.closest(".np-filter-btn");
      if (!filterBtn) return;
      npFilterRow.querySelectorAll(".np-filter-btn").forEach((b) => b.classList.remove("active"));
      filterBtn.classList.add("active");
      loadNewProducts(filterBtn.dataset.category);
    });
  </script>
</body>
</html>
