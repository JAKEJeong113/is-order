org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 프로젝트 경로에 한글("바탕 화면")이 포함돼 있어서 AGP의 기본 경로 검사에
# 걸린다 - 실제 빌드에는 문제없이 동작하는 것을 확인했으므로 비활성화한다.
android.overridePathCheck=true
# 현재 AGP(8.5.2)가 공식 테스트한 compileSdk는 34까지지만, 플레이스토어
# 요건(신규 앱 API 36 타겟)을 맞추려고 compileSdk/targetSdk를 36으로 올린다.
# 35에서도 경고만 뜨고 정상 빌드된 것을 확인했으므로 이 경고를 억제한다.
android.suppressUnsupportedCompileSdk=36
