plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 배포용(release) 서명 키 정보 - keystore.properties(git에 안 올라감,
// .gitignore 처리됨)에서 읽는다. 이 파일이 없는 환경(예: 이 레포를 처음
// 받은 다른 컴퓨터)에서는 release 서명 없이도 debug 빌드는 그대로 되게
// 해서, keystore가 아직 없다고 전체 빌드가 깨지지 않게 한다.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'kr.co.iscream.barcodesite'
    compileSdk 36

    defaultConfig {
        applicationId "kr.co.iscream.barcodesite"
        minSdk 26
        // 2026-08 부터 신규 앱은 플레이스토어에 API 36(Android 16) 타겟이
        // 필수 - 첫 출시라 이 요건을 맞춰야 업로드가 된다.
        targetSdk 36
        versionCode 3
        versionName "1.0.1"
    }

    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // 네이티브 바코드 스캐너(ScanActivity)용 - 일부 기기에서 브라우저
    // 표준 카메라 API(getUserMedia)의 초점 제어 능력치 자체가 고장나 있어
    // (실측: capabilities.focusMode가 "continuous"를 지원 안 한다면서
    // 현재값은 "continuous"라고 답하는 모순) 웹 쪽 스캔(html5-qrcode)으로는
    // 초점이 전혀 안 맞는 문제를 우회하기 위해 도입. CameraX+Camera2가
    // 브라우저의 제한된 추상화를 거치지 않고 카메라를 직접 제어한다.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
